name: Daily YouTube Short

on:
  schedule:
    - cron: "17 16 * * *" # every day at 16:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to save which scripts have been posted

concurrency: shorts

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shorts-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Make the video
        run: python make_short.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: python upload.py

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: shorts-bot/out/
          retention-days: 7

      - name: Remember what was posted
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "Posted $(jq -r .id out/meta.json)"
          git push
